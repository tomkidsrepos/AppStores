name: IPA to DEB (Release Version)

on:
  workflow_dispatch:
    inputs:
      ipa_urls:
        description: "Direct IPA URLs, one per line"
        required: true
        type: string
      category:
        description: "Release category"
        required: true
        type: choice
        default: "application"
        options:
          - application
          - game
          - utilities
          - system
          - theme
          - font
          - ringtone

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IPA_URLS: ${{ inputs.ipa_urls }}
      CATEGORY: ${{ inputs.category }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install package tools
        run: |
          sudo apt-get update && sudo apt-get install --yes aria2 dpkg-dev unzip python3 pipx
          pipx install gdown
          
      - name: Download ipa2deb script
        run: |
          wget https://raw.githubusercontent.com/tomkidsrepos/tomkidsrepos.github.io/main/ipa2deb
          chmod +x ipa2deb

      - name: Download and convert IPA files
        run: |
          set -euo pipefail
          mkdir -p work/ipa work/deb
          
          while IFS= read -r url; do
            url="${url#"${url%%[![:space:]]*}"}"
            url="${url%"${url##*[![:space:]]}"}"
            [ -z "$url" ] && continue
            
            if [[ "$url" == *"drive.google.com"* ]]; then
              file_id=$(echo "$url" | sed -E 's|.*/d/([a-zA-Z0-9_-]+).*|\1|')
              if [[ "$file_id" == "$url" ]]; then file_id=$(echo "$url" | sed -E 's|.*id=([a-zA-Z0-9_-]+).*|\1|'); fi
              if [[ "$file_id" != "$url" && -n "$file_id" ]]; then
                gdown "https://drive.google.com/uc?id=$file_id" -O "work/ipa/gdrive_app_${file_id}.ipa"
              fi
            else
              name="$(basename "${url%%\?*}")"
              aria2c -s16 -x16 --allow-overwrite=true --dir=work/ipa --out="$name" "$url"
            fi
          done <<< "$IPA_URLS"
          
          ./ipa2deb work/ipa work/deb "Admin <admin@localhost>" "https://github.com/${{ github.repository }}"

      - name: Create or update GitHub Release
        run: |
          # Tạo Release nếu chưa có (ví dụ: tạo mục 'game' hoặc 'application')
          gh release view "$CATEGORY" >/dev/null 2>&1 || \
            gh release create "$CATEGORY" --title "$CATEGORY" --notes "Các file DEB tự động đóng gói"
            
          # Upload các file DEB cực nặng lên Github Release (Giới hạn tối đa 2GB/file)
          gh release upload "$CATEGORY" work/deb/*.deb --clobber

      - name: Generate Packages Metadata
        run: |
          # 1. Quét tạo thông tin Packages cho các file vừa build
          dpkg-scanpackages -m work/deb /dev/null > work/new-Packages
          
          # 2. Thay thế đường dẫn cục bộ bằng ĐƯỜNG DẪN TẢI TRỰC TIẾP TỪ GITHUB RELEASE
          # URL sẽ có dạng: https://github.com/tomkidsrepos/AppStores/releases/download/game/ten-file.deb
          REPO_URL="https://github.com/${{ github.repository }}/releases/download/$CATEGORY"
          sed -i "s|Filename: \./work/deb/|Filename: $REPO_URL/|g" work/new-Packages
          sed -i "s|Filename: work/deb/|Filename: $REPO_URL/|g" work/new-Packages
          
          # 3. Gộp thông tin mới vào file Packages gốc (nếu có)
          if [ -f Packages ]; then
            cat work/new-Packages >> Packages
            # Lưu ý: Phiên bản nâng cao sẽ cần lệnh xóa các Package bị trùng cũ đi, nhưng tạm thời cứ nối thêm vào
          else
            cp work/new-Packages Packages
          fi
          
          bzip2 -fks Packages

      - name: Commit and Push Packages
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-convert IPA to DEB (Uploaded to Releases)"
          file_pattern: "Packages Packages.bz2"

      - name: Trigger Main Repo Sync
        if: success()
        run: |
          curl -X POST https://api.github.com/repos/tomkidsrepos/tomkidsrepos.github.io/dispatches \
          -H 'Accept: application/vnd.github.v3+json' \
          -H 'Authorization: token ${{ secrets.PAT_TOKEN }}' \
          -d '{"event_type": "trigger-sync"}'
